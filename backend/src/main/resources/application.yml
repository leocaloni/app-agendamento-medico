spring:
  application:
    name: agendamento
  datasource:
    url: jdbc:postgresql://localhost:5432/agendamento
    username: agendamento
    password: agendamento
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true
        jdbc:
          time_zone: UTC

springdoc:
  swagger-ui:
    # Mantem o token do Authorize entre recarregamentos da pagina
    persist-authorization: true
    tags-sorter: alpha

app:
  jwt:
    secret: pi-agendamento-jwt-secret-0123456789abcdef
    expiration: 24h
